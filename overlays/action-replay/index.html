<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay Test</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
    body{font:16px system-ui,sans-serif;color:#fff}
    .test{display:grid;place-items:center;width:100%;height:100%;padding:24px}
    .panel{width:min(900px,100%);padding:20px;border:2px solid #444;border-radius:14px;background:rgba(10,14,18,.92);box-shadow:0 15px 45px rgba(0,0,0,.35)}
    .panel.connected{border-color:#0384cb}
    .status{font-weight:700}
    .hint{margin:8px 0 0;color:#aaa;font-size:14px;line-height:1.45}
    video{display:none;width:100%;margin-top:18px;background:#000;border-radius:10px}
  </style>
</head>
<body>
  <main class="test">
    <section id="panel" class="panel">
      <div id="status" class="status">Connecting to Streamer.bot…</div>
      <p class="hint">POC only. This page tests an RTS-hosted OBS Browser Source talking to the local Streamer.bot WebSocket and HTTP servers.</p>
      <video id="video" controls playsinline></video>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>
  <script>
    const panel = document.getElementById('panel');
    const status = document.getElementById('status');
    const video = document.getElementById('video');

    const client = new StreamerbotClient({
      host: '127.0.0.1',
      port: 8080,
      endpoint: '/'
    });

    client.on('WebsocketClient.Open', () => {
      panel.classList.add('connected');
      status.textContent = 'Connected to Streamer.bot WebSocket';
    });

    client.on('*', ({ event, data }) => {
      console.log('Streamer.bot event:', event, data);
    });

    window.testReplay = (url) => {
      status.textContent = `Loading replay: ${url}`;
      video.src = url;
      video.style.display = 'block';
      video.load();
    };

    window.client = client;
    console.log('RTS Action Replay test loaded.');
    console.log('Run testReplay("http://127.0.0.1:7474/<mapping>/<file>.mp4") in the OBS browser console to test playback.');
  </script>
</body>
</html>
