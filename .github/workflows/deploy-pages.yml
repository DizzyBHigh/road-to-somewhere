name: Build & Deploy Road to Somewhere

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Checkout product sources
        env:
          RTS_EXTENSION_TOKEN: ${{ secrets.RTS_EXTENSION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RTS_EXTENSION_TOKEN" || { echo "RTS_EXTENSION_TOKEN is not configured"; exit 1; }
          mkdir -p .import-src
          auth=$(printf 'x-access-token:%s' "$RTS_EXTENSION_TOKEN" | base64 -w0)
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.repository')
            ref=$(echo "$entry" | jq -r '.ref // "main"')
            path=$(echo "$entry" | jq -r '.checkoutPath // empty')
            path="${path:-.import-src/${repo##*/}}"
            test -n "$repo"
            rm -rf "$path"
            mkdir -p "$(dirname "$path")"
            git -c "http.extraheader=AUTHORIZATION: basic $auth" \
              clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "$path"
          done < <(jq -c '.products[]' products/sources.json)

      - name: Import product manifests and release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RTS_EXTENSION_TOKEN: ${{ secrets.RTS_EXTENSION_TOKEN }}
        run: python3 tools/import-products.py

      - name: Sync extensions with RTS Services
        env:
          RTS_SERVICES_URL: ${{ vars.RTS_SERVICES_URL }}
          RTS_SERVICES_SYNC_KEY: ${{ secrets.RTS_SERVICES_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RTS_SERVICES_URL" || { echo "RTS_SERVICES_URL is not configured"; exit 1; }
          test -n "$RTS_SERVICES_SYNC_KEY" || { echo "RTS_SERVICES_SYNC_KEY is not configured"; exit 1; }
          while IFS= read -r entry; do
            slug=$(echo "$entry" | jq -r '.repository | split("/")[1]' | tr '[:upper:]' '[:lower:]')
            manifest="_data/$slug.json"
            test -f "$manifest" || { echo "Missing generated extension data: $manifest"; exit 1; }
            jq -c '{slug: .slug, name: .name, active: true, version: .version, downloadPath: .website.overlayZipFilename}' "$manifest" \
              | curl --fail-with-body -sS -X POST \
                  -H "Content-Type: application/json" \
                  -H "apikey: $RTS_SERVICES_SYNC_KEY" \
                  --data-binary @- \
                  "$RTS_SERVICES_URL/functions/v1/sync-extension"
            echo
          done < <(jq -c '.products[] | select(.serviceSync == true)' products/sources.json)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
