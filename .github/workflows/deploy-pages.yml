name: Build & Deploy Road to Somewhere

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      # The private extension repository is the source of truth; this checkout
      # deliberately fetches the current main branch on every build.
      - name: Checkout private extension sources
        env:
          RTS_EXTENSION_TOKEN: ${{ secrets.RTS_EXTENSION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RTS_EXTENSION_TOKEN" || { echo "RTS_EXTENSION_TOKEN is not configured"; exit 1; }
          mkdir -p .import-src
          auth=$(printf 'x-access-token:%s' "$RTS_EXTENSION_TOKEN" | base64 -w0)
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.repository')
            ref=$(echo "$entry" | jq -r '.ref // "main"')
            path=$(echo "$entry" | jq -r '.checkoutPath')
            test -n "$repo" && test -n "$path"
            rm -rf "$path"
            mkdir -p "$(dirname "$path")"
            git -c "http.extraheader=AUTHORIZATION: basic $auth" \
              clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "$path"
          done < <(jq -c '.extensions[]' extensions/sources.json)

      - name: Checkout public OBS plugin sources
        run: |
          set -euo pipefail
          mkdir -p .import-src
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.repository')
            ref=$(echo "$entry" | jq -r '.ref // "main"')
            path=$(echo "$entry" | jq -r '.checkoutPath')
            test -n "$repo" && test -n "$path"
            rm -rf "$path"
            mkdir -p "$(dirname "$path")"
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "$path"
          done < <(jq -c '.plugins[]' obs-plugins/sources.json)

      - name: Checkout RTS UI DLL source
        run: |
          set -euo pipefail
          mkdir -p .import-src
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.repository')
            ref=$(echo "$entry" | jq -r '.ref // "main"')
            path=$(echo "$entry" | jq -r '.checkoutPath')
            test -n "$repo" && test -n "$path"
            rm -rf "$path"
            mkdir -p "$(dirname "$path")"
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "$path"
          done < <(jq -c '.dlls[]' extensions/sources.json)

      - name: Import private extension manifests and public assets
        run: python3 tools/import-private-extensions.py

      - name: Sync extensions with RTS Services
        env:
          RTS_SERVICES_URL: ${{ vars.RTS_SERVICES_URL }}
          RTS_SERVICES_SYNC_KEY: ${{ secrets.RTS_SERVICES_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RTS_SERVICES_URL" || { echo "RTS_SERVICES_URL is not configured"; exit 1; }
          test -n "$RTS_SERVICES_SYNC_KEY" || { echo "RTS_SERVICES_SYNC_KEY is not configured"; exit 1; }
          while IFS= read -r entry; do
            path=$(echo "$entry" | jq -r '.checkoutPath')
            manifest="$path/site/extension.json"
            test -f "$manifest" || { echo "Missing extension manifest: $manifest"; exit 1; }
            jq -c '{slug: .slug, name: .name, active: true}' "$manifest" \
              | curl --fail-with-body -sS -X POST \
                  -H "Content-Type: application/json" \
                  -H "apikey: $RTS_SERVICES_SYNC_KEY" \
                  --data-binary @- \
                  "$RTS_SERVICES_URL/functions/v1/sync-extension"
            echo
          done < <(jq -c '.extensions[]' extensions/sources.json)

      - name: Import OBS plugin manifests and public assets
        run: python3 tools/import-obs-plugins.py

      - name: Import RTS UI DLL manifest and release information
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/import-dll.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
