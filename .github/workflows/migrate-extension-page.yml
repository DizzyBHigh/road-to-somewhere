name: One-Time Migration — RTS Ban/Timeout Page Assets

on:
  push:
    branches: [main]
    paths:
      - 'extensions/rts-ban-timeout-widget/index.html'
      - '.github/workflows/migrate-extension-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: split extension page assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Split CSS and JavaScript from extension page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('extensions/rts-ban-timeout-widget/index.html')
          text = path.read_text()

          css_match = re.search(r'<style>\s*(.*?)\s*</style>', text, re.S)
          js_match = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)

          if not css_match or not js_match:
              print('No inline style/script blocks found; nothing to migrate.')
              raise SystemExit(0)

          base = path.parent
          (base / 'extension.css').write_text(css_match.group(1).strip() + '\n')
          (base / 'extension.js').write_text(js_match.group(1).strip() + '\n')

          text = text[:css_match.start()] + '<link rel="stylesheet" href="extension.css">' + text[css_match.end():]
          js_match = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)
          text = text[:js_match.start()] + '<script src="extension.js"></script>' + text[js_match.end():]

          path.write_text(text)
          print('Migrated inline CSS and JavaScript to extension.css and extension.js')
          PY

      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extensions/rts-ban-timeout-widget/index.html extensions/rts-ban-timeout-widget/extension.css extensions/rts-ban-timeout-widget/extension.js
          git rm .github/workflows/migrate-extension-page.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: split extension page assets'
          git push
