<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/buttons.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/background.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/collapse.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/hero.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/header.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/auth.css' | relative_url }}">
  {% if page.extra_css %}
  <link rel="stylesheet" href="{{ page.extra_css | relative_url }}?v={{ site.time | date: '%s' }}">
  {% endif %}
</head>
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/formatting.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/copy-buttons.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/demo-player.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/collapse.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/extension-demo-paths.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{ '/assets/auth.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
