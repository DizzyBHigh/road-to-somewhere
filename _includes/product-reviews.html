<section class="reviews-section" id="reviews" data-extension-slug="{{ product.slug }}">
  <div class="section-heading-row">
    <div><div class="section-kicker">REVIEWS</div><h2>What people think.</h2></div>
  </div>
  <div class="reviews-layout">
    <div class="reviews-list-column">
      <div class="reviews-summary" data-review-summary>—</div>
      <div class="reviews-list" data-review-list><p class="reviews-empty">Loading reviews…</p></div>
    </div>
    <div class="review-form-card">
      <div class="section-kicker">YOUR REVIEW</div>
      <div data-review-form-state>Checking sign-in…</div>
      <button class="button button--blue review-signin" type="button" data-review-signin hidden>Sign in with Discord</button>
      <form data-review-form hidden>
        <label>Rating</label>
        <div class="review-stars" role="radiogroup" aria-label="Rating">
          {% for rating in (1..5) %}<button type="button" class="review-star" data-rating="{{ rating }}" role="radio" aria-label="{{ rating }} star{% if rating != 1 %}s{% endif %}">★</button>{% endfor %}
        </div>
        <input type="hidden" name="rating" required>
        <label>Review<textarea name="body" rows="6" maxlength="2000" required></textarea></label>
        <button class="button button--blue" type="submit">Submit review</button>
        <p class="review-form-message" data-review-message aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
