<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay Test</title>
  <style>
    body{margin:0;background:transparent;color:#fff;font:16px system-ui,sans-serif}
    #status{padding:12px;border:2px solid #444;border-radius:8px;background:#111c}
    #status.connected{border-color:#0384cb}
    #video{display:none;width:100%;max-height:80vh;background:#000}
  </style>
</head>
<body>
  <div id="status">Connecting to Streamer.bot…</div>
  <video id="video" controls playsinline></video>
  <script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>
  <script>
    const status = document.getElementById('status');
    const video = document.getElementById('video');
    const client = new StreamerbotClient();
    client.on('WebsocketClient.Open', () => {
      status.textContent = 'Connected to Streamer.bot WebSocket';
      status.classList.add('connected');
    });
    client.on('WebsocketClient.Close', () => {
      status.textContent = 'Streamer.bot WebSocket disconnected';
      status.classList.remove('connected');
    });
    client.on('*', ({event, data}) => console.log('Streamer.bot event', event, data));
    window.testReplay = (url) => {
      status.textContent = `Loading replay: ${url}`;
      video.src = url;
      video.style.display = 'block';
      video.load();
    };
    window.client = client;
  </script>
</body>
</html>
